[package]
name = "gtfs-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.41"
polars = {version = "0.50.0", features = ["dtype-struct"]}
reqwest = {version = "0.12.23", features = ["blocking"]}
serde = "1.0.219"
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio"]}
tokio = {version = "1.47.1", features = ["rt", "macros"]}
zip = "4.6.1"
